name: CI

# Two PRs are in flight against main and the test suite runs nowhere. This is
# the smallest thing that fixes that: lint, tests and a real production build
# on every pull request.
on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes the run it interrupted — except on main, where every
# commit's result is worth keeping.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The build prerenders the home page, and that page reads real crew
    # capacity, so a build without a database is not a build. Running one here
    # also means every pull request applies the migrations from scratch — a
    # migration that does not apply cleanly fails CI rather than a deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flatirons
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # One server here, so both URLs point at it. `DIRECT_URL` is set rather
    # than left to fall back so the two-connection path production uses is the
    # one CI exercises — a typo in the migration URL should fail here, not on
    # a Supabase deploy.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flatirons
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flatirons

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: it installs exactly what the lockfile
      # pins and fails if the lockfile and package.json disagree, so CI can
      # never quietly pass against a different dependency tree than a
      # developer has.
      - run: npm ci

      - name: Lint
        run: npm run lint

      # Runs before the build. The pricing engine is the business-critical
      # code here, and a failing test should be the first thing reported, not
      # something waiting behind a slower step.
      - name: Test
        run: npm run test

      # `migrate deploy` applies committed migrations only — it never
      # generates one, so a schema edited without a matching migration shows
      # up here as a drifted database rather than passing quietly.
      - name: Migrate
        run: npm run db:deploy

      - name: Seed
        run: npm run db:seed

      # Typechecks the tests as well as the app, and catches anything that
      # only breaks when prerendering — the token page calls the pricing
      # engine at build time, and the home page reads crew capacity.
      - name: Build
        run: npm run build
